[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "arknights-probe"
version = "0.1.0"
description = "Evidence-bounded probes for extracted Arknights level data"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
arknights-probe = "arknights_probe.__main__:main"

[tool.setuptools.packages.find]
include = ["arknights_probe*"]
